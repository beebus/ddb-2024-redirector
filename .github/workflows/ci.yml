name: CI

on:
  # Every push to any branch. Merging a PR into master is also a push to master, so it's covered.
  push:
    branches: [ "**" ]
  # Also check PRs into master, including ones from forks (which don't trigger the push above).
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
