# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for every npm dependency (the whole repo is frontend).
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint requires typescript <6.1.0 and relies on the classic compiler API
      # that TypeScript 7 (the native compiler) no longer ships. Remove this rule once
      # typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "github-actions"
    directory: "/" # Dependabot looks for workflows in /.github/workflows
    schedule:
      interval: "weekly"
